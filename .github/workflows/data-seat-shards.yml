name: Build Data Seat shards

on:
  push:
    paths:
      - "data-seat/incoming/**"
      - "scripts/shard-data-seat.mjs"
      - "scripts/build-pattern-index.mjs"
      - "sentinel-registry.json"
      - ".github/workflows/data-seat-shards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-seat-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Stream-shard incoming dataset
        env:
          DATA_SEAT_SHARD_MB: 20
        run: npm run data-seat:shard
      - name: Build token indexes
        run: npm run patterns:build
      - name: Validate tests
        run: npm test
      - name: Commit generated shards and indexes
        run: |
          if git diff --quiet -- data-seat/shards indexes; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-seat/shards indexes
          git commit -m "chore: rebuild Data Seat shards and indexes"
          git push
